name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline tests (syntax, shellcheck, selftest, update, certificates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run offline tests
        run: tests/run.sh

  provider:
    name: real NSX provider against a mock manager (adopt, apply, failures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Offline tests, then the provider tests
        run: tests/run.sh --provider

  e2e:
    name: real GitLab (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # fresh:   a new tree, then the whole path, then repairs
        # upgrade: a tree from the previous release, upgraded with update.sh as a consumer would
        mode: [fresh, upgrade]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # upgrade mode needs the previous release (origin/main)
      - name: Free disk for the GitLab and CI images
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /
      - name: Boot GitLab, upgrade, switch to HTTPS, run a pipeline on a network with no outside access
        run: tests/e2e-gitlab.sh ${{ matrix.mode }}
      - name: GitLab logs on failure
        if: failure()
        run: docker logs --tail=200 nsx-gitlab || true
